name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Validate plugin packages before install
        run: node scripts/preinstall-validate-plugins.mjs

      - name: Install dependencies without lifecycle scripts
        id: npm-ci
        env:
          npm_config_logs_dir: ${{ runner.temp }}/npm-logs
        run: npm ci --ignore-scripts

      - name: Upload npm debug logs
        if: failure() && steps.npm-ci.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-debug-security-audit-${{ runner.os }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-logs
          if-no-files-found: warn
          retention-days: 7

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high --workspaces

      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libcurl4-openssl-dev \
            libexpat1-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            zlib1g-dev \
            wget

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Validate plugin packages before install
        run: node scripts/preinstall-validate-plugins.mjs

      - name: Install dependencies without lifecycle scripts
        id: npm-ci
        env:
          npm_config_logs_dir: ${{ runner.temp }}/npm-logs
        run: npm ci --ignore-scripts

      - name: Prepare bundled Git and GitHub CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64) target=x86_64-unknown-linux-gnu ;;
            macOS-ARM64) target=aarch64-apple-darwin ;;
            macOS-X64) target=x86_64-apple-darwin ;;
            Windows-X64) target=x86_64-pc-windows-msvc ;;
            *) echo "::error::Unsupported release target"; exit 1 ;;
          esac
          npm run prepare:bundled-tools -- --target "$target"
          npm run verify:bundled-tools -- --target "$target"

      - name: Upload npm debug logs
        if: failure() && steps.npm-ci.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-debug-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-logs
          if-no-files-found: warn
          retention-days: 7

      - name: Frontend tests
        run: npm test

      - name: Plugin contract and boundaries
        run: npm run check:plugins

      - name: Frontend build
        run: npm run build

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

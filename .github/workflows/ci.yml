name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-archive-guard:
    name: No plugin archives in Git
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Reject indexed and newly committed plugin archives
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            npm run check:plugin-archives -- --base "$BASE_SHA"
          else
            npm run check:plugin-archives
          fi

  security-audit:
    name: Security audit
    needs: plugin-archive-guard
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Validate plugin packages before install
        run: node scripts/preinstall-validate-plugins.mjs

      - name: Install dependencies without lifecycle scripts
        id: npm-ci
        env:
          npm_config_logs_dir: ${{ runner.temp }}/npm-logs
        run: npm ci --ignore-scripts --no-audit

      - name: Upload npm debug logs
        if: failure() && steps.npm-ci.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-debug-security-audit-${{ runner.os }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-logs
          if-no-files-found: warn
          retention-days: 7

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high --workspaces --include-workspace-root

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache locked cargo-audit
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: cargo-audit-0.22.2
          cache-targets: false
          cache-on-failure: true

      - name: Install locked cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        run: node scripts/audit-rust-dependencies.mjs

  test:
    name: ${{ matrix.os }}
    needs: plugin-archive-guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select native speech platform smoke
        id: speech-scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            echo "Baseline unavailable; running the complete speech platform smoke."
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              BASE_SHA=$(git merge-base "$BASE_SHA" HEAD)
            fi
            if git diff --quiet "$BASE_SHA" HEAD -- \
              .github/workflows/ci.yml scripts/test-speech-model.ts scripts/prepare-speech-helper.mjs \
              src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/build.rs src-tauri/src/main.rs src-tauri/src/lib.rs \
              src-tauri/speech-worker src-tauri/Entitlements.plist src-tauri/SpeechHelper.entitlements.plist \
              src-tauri/tauri.conf.json src-tauri/tauri.windows.conf.json src-tauri/tauri.linux.conf.json \
              src-tauri/src/sensitive/speech_engine.rs src-tauri/src/sensitive/speech_helper.rs \
              src/lib/speech.ts src/lib/speechCaptureProcessor.js; then
              echo "required=false" >> "$GITHUB_OUTPUT"
            else
              echo "Native speech inputs changed or selection was incomplete."
              echo "required=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            dbus \
            curl \
            file \
            libayatana-appindicator3-dev \
            libcurl4-openssl-dev \
            libexpat1-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            zlib1g-dev \
            wget

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Validate plugin packages before install
        run: node scripts/preinstall-validate-plugins.mjs

      - name: Install dependencies without lifecycle scripts
        id: npm-ci
        env:
          npm_config_logs_dir: ${{ runner.temp }}/npm-logs
        run: npm ci --ignore-scripts --no-audit

      - name: Prepare bundled Git and GitHub CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64) target=x86_64-unknown-linux-gnu ;;
            macOS-ARM64) target=aarch64-apple-darwin ;;
            macOS-X64) target=x86_64-apple-darwin ;;
            Windows-X64) target=x86_64-pc-windows-msvc ;;
            *) echo "::error::Unsupported release target"; exit 1 ;;
          esac
          node scripts/bundled-tools.mjs --target "$target"
          node scripts/verify-bundled-tools.mjs --target "$target"

      - name: Upload npm debug logs
        if: failure() && steps.npm-ci.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-debug-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-logs
          if-no-files-found: warn
          retention-days: 7

      - name: Frontend tests
        run: npm test

      - name: Plugin contract and boundaries
        run: npm run check:plugins

      - name: Immutable plugin source recipes
        if: runner.os == 'Linux'
        run: npm run check:plugin-downloads -- --source

      - name: Frontend build
        # Tauri's beforeBuildCommand runs the same build on Windows.
        if: runner.os != 'Windows'
        run: npm run build

      - name: Install editor benchmark browser
        if: runner.os == 'Linux'
        run: npm exec --no -- playwright install --with-deps chromium

      - name: Editor responsiveness benchmarks
        id: editor-performance
        if: runner.os == 'Linux'
        run: |
          npx tsc --noEmit -p tsconfig.benchmarks.json
          npm exec --no -- playwright test

      - name: Upload editor benchmark failure evidence
        if: runner.os == 'Linux' && failure() && steps.editor-performance.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-performance-attempt-${{ github.run_attempt }}
          path: .performance-artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Build Windows renderer smoke binary
        if: runner.os == 'Windows'
        run: npm run tauri build -- --no-bundle

      - name: URL pattern backport tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --package urlpattern

      - name: GTK backport tests
        if: runner.os == 'Linux'
        run: node scripts/test-gtk-backports.mjs

      - name: Linux D-Bus backport tests
        if: runner.os == 'Linux'
        env:
          DENOTE_TEST_DBUS: "1"
        run: |
          dbus-run-session -- cargo test --manifest-path src-tauri/Cargo.toml --locked \
            --package tauri-plugin-opener --package tauri-plugin-single-instance \
            --package tauri-plugin-notification --lib linux_backport

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Install offline synthetic speech generator
        if: runner.os == 'Linux' && steps.speech-scope.outputs.required == 'true'
        run: sudo apt-get install --yes espeak-ng

      - name: Real local Nemotron platform smoke
        if: steps.speech-scope.outputs.required == 'true'
        shell: bash
        env:
          DENOTE_SPEECH_TEST_EXECUTABLE: ${{ runner.os == 'Windows' && format('{0}/src-tauri/resources/speech/denote-speech-worker.exe', github.workspace) || '' }}
        run: npm run test:speech-model -- --approve-download --engine-dir "${{ runner.temp }}/denote-synthetic-model"

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Smoke test Windows renderer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          winget install gerardog.gsudo --accept-source-agreements --accept-package-agreements
          icacls "$env:GITHUB_WORKSPACE" /grant "Everyone:(OI)(CI)F"
          sudo --integrity Medium pwsh -NoProfile -File scripts/windows-renderer-smoke.ps1 `
            -AppPath src-tauri/target/release/denote.exe `
            -EvidenceDirectory windows-renderer-smoke

      - name: Upload Windows renderer smoke evidence
        if: runner.os == 'Windows' && failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-renderer-smoke-attempt-${{ github.run_attempt }}
          path: windows-renderer-smoke/
          if-no-files-found: warn
          retention-days: 7

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-22.04
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Resolve release tag
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          resolve_tag_commit() {
            local object_type object_sha
            if ! read -r object_type object_sha < <(
              gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
                --jq '[.object.type, .object.sha] | @tsv'
            ); then
              echo "::error::Release tag ${RELEASE_TAG} does not exist. Push the tag before running a release." >&2
              return 1
            fi
            while [[ "$object_type" == "tag" ]]; do
              read -r object_type object_sha < <(
                gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" \
                  --jq '[.object.type, .object.sha] | @tsv'
              )
            done
            if [[ "$object_type" != "commit" ]]; then
              echo "::error::Release tag ${RELEASE_TAG} does not point to a commit." >&2
              return 1
            fi
            printf '%s\n' "$object_sha"
          }

          source_sha="$(resolve_tag_commit)"
          echo "sha=${source_sha}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - name: Verify tag commit is on main
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tags must point to a commit on main."
            exit 1
          fi

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            wget \
            xdg-utils

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: npm run release -- --check "$RELEASE_TAG"

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

  build:
    name: ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-aarch64
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-x64
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            wget \
            xdg-utils

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Build bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          DENOTE_COMMIT_HASH: ${{ needs.validate.outputs.source_sha }}
          DENOTE_BUILD_DIRTY: "false"
        with:
          args: --target ${{ matrix.target }}
          retryAttempts: 2
          uploadUpdaterJson: false

      - name: Stage AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: denote-${{ matrix.artifact }}-appimage
          path: src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          compression-level: 0
          overwrite: true

      - name: Stage Debian package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: denote-${{ matrix.artifact }}-deb
          path: src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error
          compression-level: 0
          overwrite: true

      - name: Stage RPM package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: denote-${{ matrix.artifact }}-rpm
          path: src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: error
          compression-level: 0
          overwrite: true

      - name: Stage macOS disk image
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: denote-${{ matrix.artifact }}-dmg
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          compression-level: 0
          overwrite: true

      - name: Stage Windows MSI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: denote-${{ matrix.artifact }}-msi
          path: src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error
          compression-level: 0
          overwrite: true

      - name: Stage Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: denote-${{ matrix.artifact }}-nsis
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    name: Publish release
    needs:
      - validate
      - build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download platform bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: denote-*
          path: release-assets
          merge-multiple: true

      - name: Create release with all bundles
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0 | sort -z)
          if (( ${#assets[@]} == 0 )); then
            echo "::error::No release bundles were downloaded."
            exit 1
          fi

          duplicate_names="$(
            find release-assets -type f -printf '%f\n' |
              sort |
              uniq -d
          )"
          if [[ -n "$duplicate_names" ]]; then
            echo "::error::Release bundles must have unique filenames."
            while IFS= read -r name; do
              echo "::error::${name}"
            done <<< "$duplicate_names"
            exit 1
          fi

          find_releases() {
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
              jq -s --arg tag "$RELEASE_TAG" \
                '[.[][] | select(.tag_name == $tag)]'
          }

          resolve_tag_commit() {
            local object_type object_sha
            read -r object_type object_sha < <(
              gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
                --jq '[.object.type, .object.sha] | @tsv'
            )
            while [[ "$object_type" == "tag" ]]; do
              read -r object_type object_sha < <(
                gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" \
                  --jq '[.object.type, .object.sha] | @tsv'
              )
            done
            if [[ "$object_type" != "commit" ]]; then
              echo "::error::Release tag ${RELEASE_TAG} does not point to a commit." >&2
              return 1
            fi
            printf '%s\n' "$object_sha"
          }

          assert_tag_unchanged() {
            local current_tag_sha
            current_tag_sha="$(resolve_tag_commit)"
            if [[ "$current_tag_sha" != "$SOURCE_SHA" ]]; then
              echo "::error::Release tag ${RELEASE_TAG} moved during the build."
              echo "::error::Built ${SOURCE_SHA}, but the tag now points to ${current_tag_sha}."
              return 1
            fi
          }

          assert_tag_unchanged

          releases="$(find_releases)"
          release_count="$(jq 'length' <<< "$releases")"
          if (( release_count > 1 )); then
            echo "::error::Multiple releases exist for ${RELEASE_TAG}."
            jq -r '.[] | "::error::\(.html_url)"' <<< "$releases"
            exit 1
          fi
          if (( release_count == 1 )); then
            release_id="$(jq -r '.[0].id' <<< "$releases")"
            is_draft="$(jq -r '.[0].draft' <<< "$releases")"
            if [[ "$is_draft" != "true" ]]; then
              echo "Release ${RELEASE_TAG} is already published."
              exit 0
            fi
            echo "Replacing incomplete draft release ${RELEASE_TAG}."
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          fi

          version="${RELEASE_TAG#v}"
          version_without_build="${version%%+*}"
          release_args=(
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --draft
            --generate-notes
            --title "Denote ${version}"
          )
          if [[ "$version_without_build" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" "${release_args[@]}"

          releases="$(find_releases)"
          if [[ "$(jq 'length' <<< "$releases")" != "1" ]]; then
            echo "::error::Could not resolve the completed draft release for ${RELEASE_TAG}."
            exit 1
          fi
          release_id="$(jq -r '.[0].id' <<< "$releases")"
          if ! assert_tag_unchanged; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
            exit 1
          fi
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" -F draft=false

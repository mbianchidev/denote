name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-22.04
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Resolve release tag
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          resolve_tag_commit() {
            local object_type object_sha
            if ! read -r object_type object_sha < <(
              gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
                --jq '[.object.type, .object.sha] | @tsv'
            ); then
              echo "::error::Release tag ${RELEASE_TAG} does not exist. Push the tag before running a release." >&2
              return 1
            fi
            while [[ "$object_type" == "tag" ]]; do
              read -r object_type object_sha < <(
                gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" \
                  --jq '[.object.type, .object.sha] | @tsv'
              )
            done
            if [[ "$object_type" != "commit" ]]; then
              echo "::error::Release tag ${RELEASE_TAG} does not point to a commit." >&2
              return 1
            fi
            printf '%s\n' "$object_sha"
          }

          source_sha="$(resolve_tag_commit)"
          echo "sha=${source_sha}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Reject indexed and newly committed plugin archives
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            npm run check:plugin-archives -- --base "$BASE_SHA"
          else
            npm run check:plugin-archives
          fi

      - name: Verify tag commit is on main
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tags must point to a commit on main."
            exit 1
          fi

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libcurl4-openssl-dev \
            libexpat1-dev \
            libfuse2 \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            zlib1g-dev \
            wget \
            xdg-utils

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Validate plugin packages before install
        run: node scripts/preinstall-validate-plugins.mjs

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify release version
        run: npm run release -- --check "$RELEASE_TAG"

      - name: Frontend tests
        run: npm test

      - name: Plugin contract and release artifacts
        run: npm run check:plugins

      - name: Stage verified plugin archives
        run: npm run package:plugins

      - name: Transfer verified plugin release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-release-assets
          path: .plugin-artifacts/*.tgz
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0

      - name: Frontend build
        run: npm run build

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

  build:
    name: ${{ matrix.name }}
    needs: validate
    permissions:
      attestations: write
      contents: read
      id-token: write
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-aarch64
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-x64
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libcurl4-openssl-dev \
            libexpat1-dev \
            libfuse2 \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            zlib1g-dev \
            wget \
            xdg-utils

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Validate plugin packages before install
        run: node scripts/preinstall-validate-plugins.mjs

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Prepare bundled Git and GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run prepare:bundled-tools -- --target "${{ matrix.target }}"
          npm run verify:bundled-tools -- --target "${{ matrix.target }}"

      - name: Build bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          DENOTE_COMMIT_HASH: ${{ needs.validate.outputs.source_sha }}
          DENOTE_BUILD_DIRTY: "false"
        with:
          args: --target ${{ matrix.target }}
          retryAttempts: 2
          uploadUpdaterJson: false

      - name: Smoke test installed Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir "${RUNNER_TEMP}/denote-deb"
          dpkg-deb -x src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb "${RUNNER_TEMP}/denote-deb"
          integrity="$(find "${RUNNER_TEMP}/denote-deb" -path "*/tools/${{ matrix.target }}/integrity.json" -print -quit)"
          test -n "$integrity"
          root="$(dirname "$integrity")"
          test -z "$(find "$root" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -z "$(find "${RUNNER_TEMP}/denote-deb" -name '*.tgz' -print -quit)"
          archive_root="src-tauri/target/bundled-tools/${{ matrix.target }}"
          extracted="${RUNNER_TEMP}/denote-tools"
          mkdir "$extracted"
          tar -xzf "$archive_root/denote-tools-${{ matrix.target }}-git.tar.gz" -C "$extracted"
          tar -xzf "$archive_root/denote-tools-${{ matrix.target }}-gh.tar.gz" -C "$extracted"
          "$extracted/git/bin/git" --version | grep -F "git version 2.55.0"
          "$extracted/gh/bin/gh" version | grep -F "gh version 2.99.0"

      - name: Smoke test installed macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mount="${RUNNER_TEMP}/denote-dmg"
          mkdir "$mount"
          image="$(find src-tauri/target/${{ matrix.target }}/release/bundle/dmg -name '*.dmg' -print -quit)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$image"
          trap 'hdiutil detach "$mount"' EXIT
          root="$(find "$mount" -path "*/Contents/Resources/tools/${{ matrix.target }}" -type d -print -quit)"
          test -n "$root"
          test -z "$(find "$root" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -z "$(find "$mount" -name '*.tgz' -print -quit)"
          archive_root="src-tauri/target/bundled-tools/${{ matrix.target }}"
          extracted="${RUNNER_TEMP}/denote-tools"
          mkdir "$extracted"
          tar -xzf "$archive_root/denote-tools-${{ matrix.target }}-git.tar.gz" -C "$extracted"
          tar -xzf "$archive_root/denote-tools-${{ matrix.target }}-gh.tar.gz" -C "$extracted"
          "$extracted/git/bin/git" --version | grep -F "git version 2.55.0"
          "$extracted/gh/bin/gh" version | grep -F "gh version 2.99.0"

      - name: Smoke test installed Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi" | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP "denote-msi"
          Start-Process msiexec.exe -Wait -NoNewWindow -ArgumentList @(
            "/a", "`"$($msi.FullName)`"", "/qn", "TARGETDIR=`"$destination`""
          )
          $integrity = Get-ChildItem $destination -Recurse -Filter integrity.json |
            Where-Object FullName -Like "*\tools\${{ matrix.target }}\integrity.json" |
            Select-Object -First 1
          if (-not $integrity) { throw "Bundled tools are missing from the MSI." }
          $root = $integrity.Directory.FullName
          if (Get-ChildItem $root -Filter *.tar.gz) {
            throw "Bundled tool archives must not be installed before the user selects Bundled mode."
          }
          if (Get-ChildItem $destination -Recurse -Filter *.tgz) {
            throw "Plugin archives must not be bundled in the installer."
          }
          $archiveRoot = "src-tauri/target/bundled-tools/${{ matrix.target }}"
          $tools = Join-Path $env:RUNNER_TEMP "denote-tools"
          New-Item -ItemType Directory -Path $tools | Out-Null
          tar -xzf (Join-Path $archiveRoot "denote-tools-${{ matrix.target }}-git.tar.gz") -C $tools
          tar -xzf (Join-Path $archiveRoot "denote-tools-${{ matrix.target }}-gh.tar.gz") -C $tools
          & (Join-Path $tools "git\cmd\git.exe") --version |
            Select-String -SimpleMatch "git version 2.55.0"
          & (Join-Path $tools "gh\bin\gh.exe") version |
            Select-String -SimpleMatch "gh version 2.99.0"

      - name: Generate bundled tools SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: src-tauri/resources/tools/${{ matrix.target }}
          format: spdx-json
          output-file: bundled-tools-${{ matrix.artifact }}.spdx.json
          upload-artifact: false

      - name: Write release checksums
        shell: bash
        run: |
          find "src-tauri/target/${{ matrix.target }}/release/bundle" -type f -print0 |
            sort -z |
            xargs -0 shasum -a 256 > "denote-${{ matrix.artifact }}-SHA256SUMS.txt"
          shasum -a 256 "bundled-tools-${{ matrix.artifact }}.spdx.json" \
            >> "denote-${{ matrix.artifact }}-SHA256SUMS.txt"
          shasum -a 256 src-tauri/target/bundled-tools/${{ matrix.target }}/*.tar.gz \
            >> "denote-${{ matrix.artifact }}-SHA256SUMS.txt"

      - name: Attest release bundles
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*
            src-tauri/target/bundled-tools/${{ matrix.target }}/*.tar.gz

      - name: Attest release SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*
            src-tauri/target/bundled-tools/${{ matrix.target }}/*.tar.gz
          sbom-path: bundled-tools-${{ matrix.artifact }}.spdx.json

      - name: Stage supply-chain metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: denote-${{ matrix.artifact }}-supply-chain
          path: |
            bundled-tools-${{ matrix.artifact }}.spdx.json
            denote-${{ matrix.artifact }}-SHA256SUMS.txt
          if-no-files-found: error

      - name: Stage on-demand bundled tools
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: denote-${{ matrix.artifact }}-bundled-tools
          path: src-tauri/target/bundled-tools/${{ matrix.target }}/*.tar.gz
          if-no-files-found: error
          compression-level: 0

      - name: Stage AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: denote-${{ matrix.artifact }}-appimage
          path: src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          compression-level: 0
          overwrite: true

      - name: Stage Debian package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: denote-${{ matrix.artifact }}-deb
          path: src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error
          compression-level: 0
          overwrite: true

      - name: Stage RPM package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: denote-${{ matrix.artifact }}-rpm
          path: src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: error
          compression-level: 0
          overwrite: true

      - name: Stage macOS disk image
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: denote-${{ matrix.artifact }}-dmg
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          compression-level: 0
          overwrite: true

      - name: Stage Windows MSI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: denote-${{ matrix.artifact }}-msi
          path: src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error
          compression-level: 0
          overwrite: true

      - name: Stage Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: denote-${{ matrix.artifact }}-nsis
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    name: Publish release
    needs:
      - validate
      - build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download platform bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: denote-*
          path: release-assets
          merge-multiple: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
          clean: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0

      - name: Download verified plugin release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-release-assets
          path: .plugin-artifacts

      - name: Stage corresponding Git source and legal notices
        shell: bash
        run: |
          curl --fail --location --max-redirs 3 --proto '=https' --tlsv1.2 \
            --output release-assets/git-2.55.0.tar.gz \
            https://www.kernel.org/pub/software/scm/git/git-2.55.0.tar.gz
          echo "0842dc384a23ac33ba3e570c4f3a8ded85963ee4713b1cd21153c3db41813d1e  release-assets/git-2.55.0.tar.gz" |
            shasum -a 256 --check
          curl --fail --location --max-redirs 3 --proto '=https' --tlsv1.2 \
            --output release-assets/git-2.55.0.tar.sign \
            https://www.kernel.org/pub/software/scm/git/git-2.55.0.tar.sign
          echo "8673501946204c38ebfed09603c1f3a041ed8d12b31f0aa06a474d41e359e254  release-assets/git-2.55.0.tar.sign" |
            shasum -a 256 --check
          cp bundled-tools.lock.json docs/legal/bundled-tools/* release-assets/

      - name: Recheck and stage exact plugin release bytes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { constants, copyFileSync, lstatSync, readFileSync, readdirSync } from "node:fs";
          import { join } from "node:path";

          const catalog = JSON.parse(readFileSync("plugins/catalog.json", "utf8"));
          assert(Array.isArray(catalog) && catalog.length > 0, "The release catalog must not be empty.");
          const expected = new Map();
          for (const { manifest, artifact, provenance } of catalog) {
            assert(typeof manifest.id === "string" && typeof manifest.version === "string");
            const name = `${manifest.id}-${manifest.version}.tgz`;
            assert(/^[a-z0-9][a-z0-9.+-]*\.tgz$/i.test(name), "Unsafe plugin asset filename.");
            assert(!expected.has(name), `Duplicate plugin asset: ${name}`);
            assert(/^[0-9a-f]{64}$/.test(artifact.sha256), `Invalid digest: ${name}`);
            assert(/^[0-9a-f]{40}$/.test(provenance.sourceCommit), `Invalid source commit: ${name}`);
            assert(Number.isSafeInteger(artifact.sizeBytes) && artifact.sizeBytes > 0, `Invalid size: ${name}`);
            const url = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.RELEASE_TAG}/${name}`;
            assert.equal(artifact.url, url, `Catalog URL does not target this release: ${name}`);
            expected.set(name, artifact);
          }
          assert.deepEqual(
            readdirSync(".plugin-artifacts").sort(),
            [...expected.keys()].sort(),
            "Downloaded plugin filenames must exactly match the release catalog.",
          );
          const verify = (path, artifact) => {
            const stat = lstatSync(path);
            assert(stat.isFile() && !stat.isSymbolicLink(), `Not a regular plugin archive: ${path}`);
            assert.equal(stat.size, artifact.sizeBytes, `Plugin archive size mismatch: ${path}`);
            const bytes = readFileSync(path);
            assert.equal(bytes.length, artifact.sizeBytes, `Plugin archive changed while reading: ${path}`);
            assert.equal(createHash("sha256").update(bytes).digest("hex"), artifact.sha256, `Plugin archive digest mismatch: ${path}`);
          };
          for (const [name, artifact] of expected) {
            const source = join(".plugin-artifacts", name);
            const destination = join("release-assets", name);
            verify(source, artifact);
            copyFileSync(source, destination, constants.COPYFILE_EXCL);
            verify(destination, artifact);
          }
          NODE

      - name: Create release with all bundles
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0 | sort -z)
          if (( ${#assets[@]} == 0 )); then
            echo "::error::No release bundles were downloaded."
            exit 1
          fi

          duplicate_names="$(
            find release-assets -type f -printf '%f\n' |
              sort |
              uniq -d
          )"
          if [[ -n "$duplicate_names" ]]; then
            echo "::error::Release bundles must have unique filenames."
            while IFS= read -r name; do
              echo "::error::${name}"
            done <<< "$duplicate_names"
            exit 1
          fi

          find_releases() {
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
              jq -s --arg tag "$RELEASE_TAG" \
                '[.[][] | select(.tag_name == $tag)]'
          }

          resolve_tag_commit() {
            local object_type object_sha
            read -r object_type object_sha < <(
              gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
                --jq '[.object.type, .object.sha] | @tsv'
            )
            while [[ "$object_type" == "tag" ]]; do
              read -r object_type object_sha < <(
                gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" \
                  --jq '[.object.type, .object.sha] | @tsv'
              )
            done
            if [[ "$object_type" != "commit" ]]; then
              echo "::error::Release tag ${RELEASE_TAG} does not point to a commit." >&2
              return 1
            fi
            printf '%s\n' "$object_sha"
          }

          assert_tag_unchanged() {
            local current_tag_sha
            current_tag_sha="$(resolve_tag_commit)"
            if [[ "$current_tag_sha" != "$SOURCE_SHA" ]]; then
              echo "::error::Release tag ${RELEASE_TAG} moved during the build."
              echo "::error::Built ${SOURCE_SHA}, but the tag now points to ${current_tag_sha}."
              return 1
            fi
          }

          assert_tag_unchanged

          releases="$(find_releases)"
          release_count="$(jq 'length' <<< "$releases")"
          published_count="$(
            jq '[.[] | select(.draft == false)] | length' <<< "$releases"
          )"
          if (( published_count > 1 )); then
            echo "::error::Multiple published releases exist for ${RELEASE_TAG}."
            jq -r '.[] | select(.draft == false) | "::error::\(.html_url)"' <<< "$releases"
            exit 1
          fi
          if (( published_count == 1 )); then
            while IFS= read -r release_id; do
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
            done < <(jq -r '.[] | select(.draft == true) | .id' <<< "$releases")
            echo "Release ${RELEASE_TAG} is already published."
            exit 0
          fi
          if (( release_count > 0 )); then
            echo "Replacing ${release_count} incomplete draft release(s) for ${RELEASE_TAG}."
            while IFS= read -r release_id; do
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
            done < <(jq -r '.[].id' <<< "$releases")
          fi

          version="${RELEASE_TAG#v}"
          version_without_build="${version%%+*}"
          release_args=(
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --draft
            --generate-notes
            --title "Denote ${version}"
          )
          if [[ "$version_without_build" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" "${release_args[@]}"

          releases="$(find_releases)"
          if [[ "$(jq 'length' <<< "$releases")" != "1" ]]; then
            echo "::error::Could not resolve the completed draft release for ${RELEASE_TAG}."
            exit 1
          fi
          release_id="$(jq -r '.[0].id' <<< "$releases")"
          if ! assert_tag_unchanged; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
            exit 1
          fi
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" -F draft=false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0

      - name: Verify public plugin downloads
        run: npm run check:plugin-downloads
